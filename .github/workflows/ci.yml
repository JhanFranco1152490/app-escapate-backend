name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
    paths-ignore: ['**.md']
  push:
    branches: [dev, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# Un push nuevo a un PR cancela la corrida anterior de ese mismo PR. En dev y main no se
# cancela: cada integración conserva su resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://app_escapate:app_escapate@localhost:5432/app_escapate
  TEST_DATABASE_URL: postgresql+psycopg://app_escapate:app_escapate@localhost:5432/app_escapate_test
  SECRET_KEY: ci-secret-key-that-is-long-enough-1234567890

jobs:
  lint:
    # Un PR en borrador no gasta minutos hasta que se marca como listo.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run black --check .

  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_escapate
          POSTGRES_PASSWORD: app_escapate
          POSTGRES_DB: app_escapate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_escapate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      # El rol de la imagen es superusuario, así que la suite puede crear y borrar app_escapate_test.
      - run: uv run pytest --cov -q

      # Con la base al día, los modelos no pueden tener cambios sin migración.
      - run: uv run alembic upgrade head
      - run: uv run alembic check
